<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Werwolf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

<div id="app">
  <div class="oben">
    <header class="kopf" id="kopf"></header>
    <nav class="reiter" id="reiter"></nav>
  </div>
  <main id="inhalt"><p class="leise mitte">Verbinde …</p></main>
  <div id="erzaehler"></div>
  <div id="meldung" hidden></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=1.0"></script>
<!-- Reihenfolge zwingend: rollen -> regeln -> sprecher -> game-service ->
     bildschirme -> app. Jede Datei benutzt die vorherigen; app.js startet
     die Oberfläche und kommt zuletzt. -->
<script src="rollen.js?v=1.0"></script>
<script src="regeln.js?v=1.1"></script>
<script src="sprecher.js?v=1.0"></script>
<script src="game-service.js?v=1.0"></script>
<script src="bildschirme.js?v=1.1"></script>
<script src="app.js?v=1.2"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
