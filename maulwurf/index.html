<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Der Maulwurf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1424">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=3.1">

<body>

<!-- Die gesamte Oberfläche wird gezeichnet: Kopfzeile, Reiter, Menüs, Warteraum,
     Besprechung, Spielfeld und Aufgaben-Dialoge. Im Dokument steht
     nur die Zeichenfläche und ein unsichtbares Eingabefeld. -->
<canvas id="buehne"></canvas>

<!-- Tastatur-Stellvertreter: Wer auf der Zeichenfläche in ein Eingabefeld tippt,
     bekommt hier den Fokus. Nur so öffnet sich auf dem iPhone die Bildschirm-
     tastatur — Safari verlangt dafür ein echtes Feld und eine echte Nutzergeste.
     Sichtbar ist es nie; geschrieben wird der Text auf die Zeichenfläche.
     Es MUSS im Sichtbereich liegen und mindestens 16px Schrift haben, sonst
     scrollt oder zoomt iOS beim Fokussieren. -->
<input id="tastatur-proxy" type="text" autocomplete="off" autocorrect="off"
       autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=1.0"></script>
<script src="karte.js?v=3.1"></script>
<script src="rollen.js?v=1.2"></script>
<script src="ui.js?v=1.5"></script>
<script src="aufgaben.js?v=3.2"></script>
<script src="game-service.js?v=2.10"></script>
<script src="bildschirme.js?v=1.6"></script>
<script src="spielfeld.js?v=1.2"></script>
<!-- app.js zuletzt: es startet die Oberfläche und braucht dafür die beiden
     Zeichen-Module bereits. -->
<script src="app.js?v=4.6"></script>
</body>
</html>
